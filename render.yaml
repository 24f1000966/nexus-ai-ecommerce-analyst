# Render Blueprint: Dashboard -> New -> Blueprint -> pick this repo.
# Creates the API and the React site. The database is NOT provisioned here —
# use a free, permanent Postgres from Neon (neon.tech) or Supabase instead of
# Render's own free Postgres, which auto-expires after 30 days. Paste that
# connection string into DATABASE_URL when Render asks for it below.
services:
  - type: web
    name: nexus-ai-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-server.txt
    startCommand: uvicorn backend.main:api --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: NEXUS_ENV
        value: production
      - key: DATABASE_URL
        sync: false # paste your Neon/Supabase Postgres connection string here
      - key: NEXUS_SECRET_KEY
        generateValue: true
      - key: NEXUS_ADMIN_EMAIL
        value: superadmin@nexusai.in
      - key: NEXUS_ADMIN_PASSWORD
        sync: false # you choose it when creating the Blueprint (min 10 chars)
      - key: CORS_ORIGINS
        value: https://nexus-ai-web.onrender.com

  - type: web
    name: nexus-ai-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
