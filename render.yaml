# Render Blueprint: Dashboard -> New -> Blueprint -> pick this repo.
# Creates the API, the React site and a Postgres database, wired together.
services:
  - type: web
    name: nexus-ai-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-server.txt
    startCommand: uvicorn backend.main:api --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: NEXUS_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: nexus-ai-db
          property: connectionString
      - key: NEXUS_SECRET_KEY
        generateValue: true
      - key: NEXUS_ADMIN_EMAIL
        value: superadmin@nexusai.in
      - key: NEXUS_ADMIN_PASSWORD
        sync: false # you choose it when creating the Blueprint (min 10 chars)
      - key: CORS_ORIGINS
        value: https://nexus-ai-web.onrender.com

  - type: web
    name: nexus-ai-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 22.12.0

databases:
  - name: nexus-ai-db
    plan: free
    databaseName: nexus
    user: nexus
    ipAllowList: [] # private network only: reachable from the API, not the internet
